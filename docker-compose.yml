services:
  engine:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: tail -f /dev/null

  cli:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: tail -f /dev/null
    depends_on:
      - engine

  webui:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: tail -f /dev/null
    depends_on:
      - engine
